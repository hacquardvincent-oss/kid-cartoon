* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* `hidden` doit toujours l'emporter sur nos display: flex / grid */
[hidden] { display: none !important; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  color: var(--ink);
  background: var(--paper);
  min-height: 100%;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}

/* le grain du papier, sur toute la page */
.grain-layer {
  position: fixed; inset: 0; pointer-events: none; z-index: 40;
  background-image: var(--grain);
  background-size: 96px 96px;
  opacity: .32;
  mix-blend-mode: multiply;
}

main, .topbar, .tabs, .mainnav { position: relative; z-index: 1; }

/* ---------------- le bandeau du magazine ---------------- */
.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: calc(var(--safe-top) + 12px) 14px 12px;
  background: var(--rouge);
  border-bottom: 3px solid var(--ink);
  box-shadow: 0 3px 0 rgba(58, 42, 34, .12);
}
/* le logo : partout, il ramène à l'accueil */
.logo {
  flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0;
  background: none; border: 0; padding: 0; cursor: pointer;
  font-family: inherit; color: inherit; text-align: left;
  transition: transform .12s;
}
.logo:active { transform: scale(.96); }
.logo-txt {
  display: flex; flex-direction: column; line-height: .92; min-width: 0;
}
.logo-txt b {
  font-size: 21px; font-weight: 700; color: #fff6e4; letter-spacing: .5px;
}
.logo-txt i {
  font-style: normal; font-size: 15px; font-weight: 600; letter-spacing: 2.6px;
  color: var(--jaune);
}

/* ---------------- le menu principal ---------------- */
.mainnav {
  position: relative; z-index: 1;
  display: flex; gap: 10px; justify-content: center;
  padding: 12px 14px 2px;
}
.mainnav button {
  flex: 0 1 auto; font-family: inherit; cursor: pointer;
  font-size: 16px; font-weight: 600; padding: 9px 22px;
  border: 3px solid var(--ink); border-radius: 999px;
  background: var(--page); color: var(--ink);
  box-shadow: 0 3px 0 var(--ink);
  transition: transform .12s, box-shadow .12s, background .15s;
}
.mainnav button:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.mainnav button.is-active { background: var(--jaune); }

/* le compte du soir : combien d'histoires il reste à lire */
.soir-badge {
  flex: 0 0 auto; height: 40px; padding: 0 13px; border-radius: 999px;
  border: 2.5px solid var(--ink); background: var(--jaune); color: var(--ink);
  font-family: inherit; font-size: 15px; cursor: pointer;
  display: flex; align-items: center; gap: 5px;
  box-shadow: 0 2px 0 var(--ink); margin-right: 8px;
}
.soir-badge b { font-size: 19px; font-weight: 700; }
.soir-badge.fini { background: var(--page); color: var(--ink-soft); }
.soir-badge:active { transform: translateY(2px); box-shadow: 0 0 0 var(--ink); }

.soir {
  display: flex; align-items: center; justify-content: center;
  flex-wrap: wrap; gap: 8px; margin: 0 0 10px;
}
.soir-titre { font-size: 14.5px; color: var(--ink-soft); }
.soir-titre b { color: var(--ink); font-size: 17px; }
.soir-choix { display: flex; gap: 6px; }
.soir-choix button {
  width: 34px; height: 34px; border-radius: 50%;
  border: 2.5px solid var(--ink); background: var(--page); color: var(--ink);
  font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  box-shadow: 0 2px 0 var(--ink);
}
.soir-choix button:active { transform: translateY(2px); box-shadow: 0 0 0 var(--ink); }
.soir-regle { display: flex; align-items: center; gap: 10px; }
.soir-pm {
  width: 34px; height: 34px; border-radius: 50%;
  border: 2.5px solid var(--ink); background: var(--jaune); color: var(--ink);
  font-family: inherit; font-size: 20px; font-weight: 700; line-height: 1; cursor: pointer;
  box-shadow: 0 2px 0 var(--ink);
}
.soir-pm:active { transform: translateY(2px); box-shadow: 0 0 0 var(--ink); }
.soir-pm[disabled] { opacity: .35; box-shadow: none; }
.soir-changer {
  font-family: inherit; cursor: pointer; background: none; border: 0; padding: 0;
  color: var(--ink-soft); font-size: 13.5px;
  text-decoration: underline; text-underline-offset: 3px;
}

.icon-btn {
  flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%;
  border: 2.5px solid var(--ink);
  background: #fff6e4; color: var(--ink);
  font-size: 19px; line-height: 1; cursor: pointer;
  display: grid; place-items: center; font-family: inherit;
  box-shadow: 0 2px 0 var(--ink);
  transition: transform .12s, box-shadow .12s;
}
.icon-btn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--ink); }
#btnBack { font-size: 28px; padding-bottom: 4px; }

/* ---------------- les rubriques ---------------- */
.tabs {
  display: flex; gap: 8px; overflow-x: auto; padding: 12px 14px 4px;
  scrollbar-width: none;
}
.tabs::before, .tabs::after { content: ''; flex: 0 0 2px; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 2.5px solid var(--ink);
  background: var(--page); color: var(--ink);
  border-radius: 999px; padding: 7px 15px; font-size: 14.5px; font-weight: 500;
  font-family: inherit; cursor: pointer; white-space: nowrap;
  box-shadow: 0 2px 0 var(--ink);
  transition: transform .12s, box-shadow .12s, background .12s;
}
.tab:active { transform: translateY(2px); box-shadow: 0 0 0 var(--ink); }
.tab.is-active { background: var(--tc2, var(--jaune)); font-weight: 600; }

/* ---------------- LA UNE ---------------- */
.cover {
  height: 100vh; height: 100svh;
  display: flex;
  padding: 0;
}
/* la une occupe tout l'écran : l'illustration prend la place qui reste */
.cover-sheet {
  position: relative; width: 100%; height: 100%;
  display: flex; flex-direction: column;
  background: var(--page);
  overflow: hidden;
}

.cover-head {
  flex: 0 0 auto; background: var(--rouge); color: #fff6e4;
  padding: calc(var(--safe-top) + 12px) 16px 14px;
  border-bottom: 4px solid var(--ink);
  text-align: center;
}
.cover-logo {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-bottom: 8px; color: #fff6e4;
  font-size: 13px; font-weight: 600; letter-spacing: 2.4px;
}
.cover-head h1 {
  margin: 0; font-size: clamp(30px, 8.5vw, 44px); font-weight: 700;
  line-height: .98; letter-spacing: -.5px; text-wrap: balance;
}
.cover-head h1 b {
  color: var(--jaune); font-weight: 700;
  -webkit-text-stroke: 1.5px var(--ink);
  paint-order: stroke fill;
}
.cover-meta {
  margin-top: 5px; font-size: 12.5px; letter-spacing: 1.6px;
  text-transform: uppercase; color: #ffd9c9;
}

/* le dessin remplit tout l'espace disponible ; la composition change de
   forme selon l'écran (voir COUVERTURE.large et COUVERTURE.haut) */
.cover-art {
  flex: 1 1 auto; min-height: 0;
  position: relative; border-bottom: 4px solid var(--ink);
}
.cover-art svg { display: block; width: 100%; height: 100%; }
.cover-art::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background-image: var(--grain); background-size: 96px 96px;
  opacity: .3; mix-blend-mode: multiply;
}

/* la pastille du kiosque */
.cover-sticker {
  position: absolute; top: 5%; left: 16px; z-index: 3;
  width: 84px; height: 84px; border-radius: 50%;
  background: var(--jaune); border: 3px solid var(--ink);
  box-shadow: 3px 3px 0 rgba(58, 42, 34, .35);
  display: grid; place-content: center; text-align: center;
  transform: rotate(-11deg); line-height: 1.05;
}
.cover-sticker b { display: block; font-size: 27px; font-weight: 700; }
.cover-sticker span { font-size: 10.5px; font-weight: 500; }

.cover-foot {
  flex: 0 0 auto; text-align: center;
  padding: 14px 16px calc(var(--safe-bot) + 16px);
}
/* le menu de rubriques, dans le bandeau : les deux seules portes d'entrée */
.cover-nav {
  display: flex; gap: 10px; justify-content: center; margin-top: 12px;
}
.cover-nav button {
  font-family: inherit; cursor: pointer;
  font-size: 16px; font-weight: 600; padding: 9px 22px;
  border: 3px solid var(--ink); border-radius: 999px;
  background: var(--page); color: var(--ink);
  box-shadow: 0 3px 0 var(--ink);
  transition: transform .12s, box-shadow .12s, background .15s;
}
.cover-nav button:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.cover-random {
  font-family: inherit; cursor: pointer;
  background: none; border: 0; color: var(--ink-soft);
  font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px;
}

/* sur un écran large, le bandeau et le pied se resserrent : chaque pixel
   rendu à l'illustration, c'est du ciel qu'on cesse de rogner */
@media (min-width: 720px) {
  .cover-sticker { width: 104px; height: 104px; left: 30px; top: 5%; }
  .cover-sticker b { font-size: 33px; }
  .cover-head { padding: 12px 16px 10px; }
  .cover-head h1 { font-size: clamp(34px, 3.6vw, 48px); }
  .cover-logo { margin-bottom: 4px; font-size: 12px; }
  .cover-meta { margin-top: 3px; font-size: 11.5px; }
  .cover-foot { padding: 10px 16px 14px; }
  .cover-nav { margin-top: 9px; }
  .cover-nav button { font-size: 17px; padding: 10px 28px; }
}

/* ---------------- le sommaire ---------------- */
.view { padding: 12px 14px 40px; }
.hello { margin: 2px 2px 14px; color: var(--ink-soft); font-size: 15px; }
.hello b { color: var(--ink); }

/* les filtres par thème : ils traversent les univers */
.filtres { margin: 0 0 16px; }
.filtres-titre {
  display: block; margin: 0 2px 7px;
  font-size: 12px; font-weight: 600; letter-spacing: 1.6px;
  text-transform: uppercase; color: var(--ink-soft);
}
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  font-family: inherit; cursor: pointer; white-space: nowrap;
  font-size: 13.5px; font-weight: 500; padding: 6px 13px;
  border: 2.5px solid var(--ink); border-radius: 999px;
  background: var(--page); color: var(--ink);
  box-shadow: 0 2px 0 var(--ink);
  transition: transform .12s, box-shadow .12s, background .12s;
}
.chip i { font-style: normal; opacity: .5; font-size: 12px; margin-left: 2px; }
.chip:active { transform: translateY(2px); box-shadow: 0 0 0 var(--ink); }
.chip.is-active { background: var(--jaune); font-weight: 600; }
.chip.is-active i { opacity: .7; }

.lien-effacer {
  font-family: inherit; cursor: pointer; margin-left: 6px;
  background: none; border: 0; padding: 0; color: var(--ink-soft);
  font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px;
}

.uni-grid { display: grid; gap: 18px; }

/* chaque univers : une couverture de magazine */
.uni-card {
  position: relative; display: block; width: 100%; padding: 0;
  border: 3px solid var(--ink); border-radius: 4px; overflow: hidden; cursor: pointer;
  background: var(--page); text-align: left; font-family: inherit; color: var(--ink);
  box-shadow: 5px 6px 0 rgba(58, 42, 34, .22);
  transition: transform .14s, box-shadow .14s;
}
.uni-card:active { transform: translate(2px, 3px); box-shadow: 2px 3px 0 rgba(58, 42, 34, .22); }
.uni-card .band {
  background: var(--rouge); color: #fff6e4;
  padding: 7px 12px; display: flex; align-items: baseline; gap: 8px;
  border-bottom: 3px solid var(--ink);
}
.uni-card .band h3 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .3px; }
.uni-card .band .num {
  margin-left: auto; font-size: 12px; color: var(--jaune); white-space: nowrap;
}
.uni-card .thumb { display: block; aspect-ratio: 16 / 10; position: relative; }
.uni-card .thumb svg { display: block; width: 100%; height: 100%; }
.uni-card .cap {
  padding: 9px 12px 11px; display: flex; align-items: center; gap: 10px;
  border-top: 3px solid var(--ink); background: var(--page);
}
.uni-card .cap p { margin: 0; font-size: 13.5px; color: var(--ink-soft); }
.uni-card .pill {
  margin-left: auto; flex: 0 0 auto;
  background: var(--jaune); border: 2px solid var(--ink); border-radius: 999px;
  padding: 3px 10px; font-size: 12px; font-weight: 500; white-space: nowrap;
}
.foot-note { margin: 26px 2px 0; font-size: 12.5px; color: var(--ink-soft); opacity: .75; }

/* ---------------- entête d'univers ---------------- */
.uni-head { text-align: center; margin: 2px 0 4px; }
.uni-head h2 { margin: 0; font-size: 25px; font-weight: 700; }
.uni-head p { margin: 3px 0 0; font-size: 14px; color: var(--ink-soft); }

/* ---------------- LE PRÉSENTOIR (cover flow) ---------------- */
.cf-stage {
  position: relative;
  height: min(56vh, 330px);
  margin: 10px -14px 0;
  perspective: 1000px;
  perspective-origin: 50% 44%;
  overflow: hidden;
  touch-action: pan-y;
}
.cf {
  position: absolute; inset: 0;
  transform-style: preserve-3d;
  outline: none;
}
.cf-item {
  position: absolute;
  top: 50%; left: 50%;
  width: min(44vw, 194px);
  aspect-ratio: 3 / 4;
  margin: calc(min(44vw, 194px) * 4 / 3 / -2 * 1.04) 0 0 calc(min(44vw, 194px) / -2);
  cursor: pointer;
  will-change: transform;
  transition: transform .42s cubic-bezier(.22, .68, .3, 1);
  transform-style: preserve-3d;
}
.cf.is-dragging .cf-item { transition: none; }

/* une couverture : bandeau rouge, illustration, titre */
.cf-art {
  position: relative; width: 100%; height: 100%;
  overflow: hidden; background: var(--page);
  border: 3px solid var(--ink);
  box-shadow: 4px 5px 0 rgba(58, 42, 34, .3);
  display: flex; flex-direction: column;
}
.cf-art .cf-band {
  flex: 0 0 auto; background: var(--rouge); color: var(--jaune);
  font-size: 9.5px; font-weight: 600; letter-spacing: .4px;
  padding: 3px 7px; display: flex; justify-content: space-between;
  border-bottom: 2px solid var(--ink);
}
.cf-art svg { display: block; width: 100%; flex: 1 1 auto; min-height: 0; }
.cf-art .cf-name {
  flex: 0 0 auto; border-top: 2px solid var(--ink); background: var(--page);
  padding: 4px 7px 5px; font-size: 10.5px; font-weight: 600; line-height: 1.15;
  text-align: center;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.cf-art::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background-image: var(--grain); background-size: 96px 96px;
  opacity: .3; mix-blend-mode: multiply;
}
.cf-item .cf-shade {
  position: absolute; inset: 0; pointer-events: none;
  background: rgba(58, 42, 34, .42); opacity: 0;
  transition: opacity .42s;
}

/* le reflet du présentoir */
.cf-reflect {
  position: absolute; top: 100%; left: 0; width: 100%; height: 46%;
  overflow: hidden;
  transform: scaleY(-1); transform-origin: top;
  margin-top: 3px; opacity: .2; pointer-events: none;
  -webkit-mask-image: linear-gradient(to top, rgba(0, 0, 0, .9), transparent 85%);
  mask-image: linear-gradient(to top, rgba(0, 0, 0, .9), transparent 85%);
}
.cf-reflect .cf-band, .cf-reflect .cf-name { display: none; }
.cf-reflect svg { display: block; width: 100%; height: 210%; }

.cf-badge {
  position: absolute; top: 24px; right: 6px; z-index: 2;
  background: var(--jaune); color: var(--ink);
  font-size: 10.5px; font-weight: 600; padding: 2px 7px;
  border: 2px solid var(--ink); border-radius: 999px;
}

/* ---------------- l'ourlet de l'histoire ---------------- */
.cf-meta { text-align: center; margin-top: 10px; }
.cf-tags { display: flex; gap: 6px; justify-content: center; min-height: 22px; flex-wrap: wrap; }
.cf-tags span {
  font-size: 11.5px; padding: 2px 9px; border-radius: 999px;
  background: var(--paper-2); border: 2px solid var(--paper-3);
  color: var(--ink-soft);
}
.cf-meta h3 {
  margin: 9px 0 0; font-size: 22px; font-weight: 700; line-height: 1.15;
  min-height: 26px; text-wrap: balance;
}
.cf-meta p { margin: 3px 0 0; font-size: 14px; color: var(--ink-soft); min-height: 18px; }

.cta {
  margin-top: 14px; cursor: pointer; font-family: inherit;
  padding: 12px 30px; border-radius: 999px; font-size: 17px; font-weight: 600;
  color: #fff6e4; background: var(--rouge);
  border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
  transition: transform .12s, box-shadow .12s;
}
.cta:active { transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }

/* le grand bouton de lecture : une flèche qu'on reconnaît sans savoir lire */
.cta-lire {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 9px 26px 9px 10px;
}
.cta-img {
  width: 44px; height: 44px; border-radius: 50%; flex: 0 0 auto;
  background: #fff6e4; color: var(--rouge);
  display: grid; place-content: center;
  font-size: 21px; line-height: 1; padding-left: 3px;
  border: 3px solid var(--ink);
}
.cta-mot { font-size: 18px; }

/* boutons illustrés : la grande image d'abord, le mot en petit dessous */
.bi {
  font-family: inherit; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  width: 88px; padding: 9px 4px 7px;
  border: 3px solid var(--ink); border-radius: 18px;
  background: var(--page); color: var(--ink); box-shadow: 0 4px 0 var(--ink);
  transition: transform .12s, box-shadow .12s;
}
.bi:active { transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
.bi.primary { background: var(--jaune); }
.bi-img { font-size: 30px; line-height: 1.05; }
.bi-mot { font-size: 12.5px; font-weight: 600; letter-spacing: .2px; }


.cf-dots { display: flex; gap: 7px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
.cf-dots i {
  width: 8px; height: 8px; border-radius: 50%; background: var(--paper-3);
  border: 1.5px solid var(--ink); opacity: .45; transition: .2s;
}
.cf-dots i.on { background: var(--rouge); opacity: 1; transform: scale(1.2); }

/* ---------------- LES JEUX ---------------- */
.jeux-grid { display: grid; gap: 14px; margin-top: 12px; }
.jeu-carte {
  display: flex; align-items: center; gap: 14px; width: 100%;
  padding: 10px 14px 10px 10px; cursor: pointer; font-family: inherit;
  background: var(--page); color: var(--ink); text-align: left;
  border: 3px solid var(--ink); border-radius: 4px;
  box-shadow: 5px 6px 0 rgba(58, 42, 34, .22);
  transition: transform .14s, box-shadow .14s;
}
.jeu-carte:active { transform: translate(2px, 3px); box-shadow: 2px 3px 0 rgba(58, 42, 34, .22); }
.jeu-vignette {
  flex: 0 0 auto; width: 76px; height: 76px; border-radius: 50%;
  background: var(--paper-2); border: 2.5px solid var(--ink); overflow: hidden;
}
.jeu-vignette svg { display: block; width: 100%; height: 100%; }
.jeu-texte h3 { margin: 0; font-size: 18px; font-weight: 700; }
.jeu-texte p { margin: 2px 0 0; font-size: 13.5px; color: var(--ink-soft); }

/* le plateau */
.jeu-stage { margin-top: 10px; }
.jeu-etoiles { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
.jeu-etoiles .etoile {
  width: 22px; height: 22px; background: var(--paper-3);
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  transition: background .25s, transform .25s;
}
.jeu-etoiles .etoile.on { background: var(--jaune); transform: scale(1.15); }
.jeu-consigne {
  margin: 0 0 12px; text-align: center; font-size: 17px; font-weight: 500;
  min-height: 22px; text-wrap: balance;
}
.jeu-zone { position: relative; }

/* relier */
.relier { position: relative; display: flex; justify-content: space-between; gap: 12px; }
.relier-col { display: flex; flex-direction: column; gap: 12px; flex: 0 0 42%; }
.relier-traits { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.relier-traits line { stroke: var(--rouge); stroke-width: 5; stroke-linecap: round; }
.carte {
  width: 100%; aspect-ratio: 1 / 1; padding: 4px; cursor: pointer;
  background: var(--page); border: 3px solid var(--ink); border-radius: 4px;
  box-shadow: 3px 4px 0 rgba(58, 42, 34, .2);
  transition: transform .12s, box-shadow .12s, background .2s, border-color .2s;
}
.carte svg { display: block; width: 100%; height: 100%; }
.carte.choisie { background: var(--jaune); transform: translateY(-2px); }
.carte.ok { background: #dff0d2; border-color: #4f8a3d; box-shadow: 3px 4px 0 rgba(79, 138, 61, .35); }
.carte.secoue { animation: secoue .4s; }
@keyframes secoue {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-7px); }
  75% { transform: translateX(7px); }
}

/* compter */
.jeu-tableau { border: 3px solid var(--ink); overflow: hidden; background: var(--page); }
.jeu-tableau svg { display: block; width: 100%; height: auto; }
.chiffres { display: flex; gap: 12px; justify-content: center; margin-top: 16px; }
.chiffre {
  width: 74px; height: 74px; font-family: inherit; cursor: pointer;
  font-size: 34px; font-weight: 700; color: var(--ink);
  background: var(--page); border: 3px solid var(--ink); border-radius: 16px;
  box-shadow: 0 5px 0 var(--ink);
  transition: transform .12s, box-shadow .12s, background .2s;
}
.chiffre:active { transform: translateY(5px); box-shadow: 0 0 0 var(--ink); }
.chiffre.ok { background: #a8dc8c; }
.chiffre.secoue { animation: secoue .4s; }

/* écrire */
/* un jeu à l'écran entier : plus de bandeau, plus de titre, rien à faire
   défiler — c'est la seule façon de tenir deux cases sur un téléphone */
.jeu-plein {
  position: fixed; inset: 0; z-index: 60; margin: 0; max-width: none;
  background: var(--paper); background-image: var(--grain);
  background-size: 96px 96px;
  display: flex; flex-direction: column;
  padding: calc(var(--safe-top) + 10px) 8px calc(var(--safe-bot) + 8px);
}
.jeu-plein .jeu-etoiles { flex: 0 0 auto; margin: 0 44px 6px 0; }
.jeu-plein .jeu-consigne { flex: 0 0 auto; margin: 0 0 6px; font-size: 16px; }
.jeu-plein .jeu-zone { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.jeu-plein .diff { flex: 1 1 auto; min-height: 0; margin: 0; grid-template-rows: 1fr 1fr; }
.jeu-plein .diff-vue { aspect-ratio: auto; height: 100%; min-height: 0; }
.jeu-plein .diff-score { flex: 0 0 auto; margin: 6px 0 0; }
.jeu-fermer {
  position: absolute; top: calc(var(--safe-top) + 8px); right: 10px; z-index: 3;
  width: 38px; height: 38px; border-radius: 50%;
  border: 2.5px solid var(--ink); background: var(--page); color: var(--ink);
  font-family: inherit; font-size: 17px; line-height: 1; cursor: pointer;
  box-shadow: 0 2px 0 var(--ink);
}
.jeu-fermer:active { transform: translateY(2px); box-shadow: 0 0 0 var(--ink); }

/* les 6 différences : deux fois la même case, à un détail près */
/* sur un téléphone, la case va d'un bord à l'autre : chaque pixel compte
   pour viser un détail du doigt */
.diff { display: grid; gap: 8px; margin: 0 -14px; }
.diff-vue {
  position: relative; aspect-ratio: 800 / 560; overflow: hidden;
  border: 3px solid var(--ink); background: var(--page);
  box-shadow: 3px 4px 0 rgba(58, 42, 34, .2);
  cursor: pointer; touch-action: manipulation;
}
.diff-vue svg { display: block; width: 100%; height: 100%; }
.diff-vue.rate { animation: secousse .26s; }
@keyframes secousse {
  25% { transform: translateX(-5px); } 75% { transform: translateX(5px); }
}
.diff-marque {
  fill: none; stroke: #e0453c; stroke-width: 9; stroke-linecap: round;
  stroke-dasharray: 26 16; opacity: .95;
}
.diff-score { text-align: center; margin: 10px 0 0; font-size: 17px; color: var(--ink-soft); }
.diff-score b { font-size: 24px; color: var(--rouge); }

@media (min-width: 760px) {
  .diff { grid-template-columns: 1fr 1fr; margin: 0; gap: 12px; }
  .jeu-plein .diff { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
}

/* le rang de jeux, pour passer de l'un à l'autre */
.jeux-nav {
  display: flex; gap: 7px; overflow-x: auto; padding: 0 0 10px;
  margin: 0 -14px 10px; padding-inline: 14px;
  scrollbar-width: none;
}
.jeux-nav::-webkit-scrollbar { display: none; }
.jeux-nav .chip { flex: 0 0 auto; }

/* choisir un prénom, choisir une lettre */
.choix-grille {
  display: grid; gap: 8px; margin: 0 0 14px;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
}
.choix-b {
  font-family: inherit; cursor: pointer;
  font-size: 16px; font-weight: 600; letter-spacing: .5px;
  padding: 12px 6px; color: var(--ink);
  background: var(--page); border: 3px solid var(--ink); border-radius: 14px;
  box-shadow: 0 3px 0 var(--ink);
}
.choix-b:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.choix-hasard {
  display: block; width: 100%; font-family: inherit; cursor: pointer;
  font-size: 16px; font-weight: 600; padding: 11px 16px;
  background: var(--jaune); color: var(--ink);
  border: 3px solid var(--ink); border-radius: 999px; box-shadow: 0 3px 0 var(--ink);
}
.choix-hasard:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }

/* reconnaître une lettre parmi trois */
.lettres-choix { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.lettre-b {
  cursor: pointer; aspect-ratio: 1 / 1; padding: 8px;
  background: var(--page); color: var(--ink);
  border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink);
}
.lettre-b svg { display: block; width: 100%; height: 100%; }
.lettre-b:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.lettre-b.juste { background: #cfe8bd; color: #3d6b2c; }
.lettre-b.faux { animation: secousse .3s; }

/* le prénom en cours d'écriture, lettre par lettre */
.prenom {
  display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
  margin: 0 0 12px;
}
.prenom span {
  min-width: 34px; padding: 4px 6px; text-align: center;
  font-size: 21px; font-weight: 700; color: var(--ink-soft);
  background: var(--paper-2); border: 2.5px solid var(--paper-3);
  border-radius: 10px;
}
.prenom span.ici { color: var(--ink); background: var(--jaune); border-color: var(--ink); }
.prenom span.fait { color: #4f8a3d; background: #e3f0d8; border-color: #a9cf94; }

.trace {
  width: min(100%, 340px); margin: 0 auto; aspect-ratio: 1 / 1;
  background: var(--page); border: 3px solid var(--ink);
  box-shadow: 4px 5px 0 rgba(58, 42, 34, .2);
  touch-action: none;
}
.trace svg { display: block; width: 100%; height: 100%; }
.trace .guide { stroke: var(--paper-3); stroke-linecap: round; }
.trace .guide.fait { stroke: #cfe4c0; }
.trace .pointille { stroke: var(--ink-soft); stroke-dasharray: 3 4; opacity: .5; }
.trace .depart { fill: #4f8a3d; }
.trace .encre { fill: none; stroke: var(--rouge); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
.trace .ecrit { stroke: #4f8a3d; stroke-linecap: round; }

/* félicitations */
.jeu-bravo {
  position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
  background: rgba(246, 236, 217, .92); z-index: 5; animation: pop .3s ease;
}
.jeu-bravo b { font-size: 30px; color: var(--rouge); }
.bravo-etoile { font-size: 62px; animation: tourne .8s ease; }
@keyframes pop { from { opacity: 0; transform: scale(.9); } }
@keyframes tourne { from { transform: rotate(-25deg) scale(.4); } }

.jeu-fin { text-align: center; padding: 20px 10px; }
.fin-etoiles { font-size: 46px; letter-spacing: 4px; }
.jeu-fin h3 { margin: 8px 0 4px; font-size: 28px; color: var(--rouge); }
.jeu-fin p { margin: 0 0 18px; color: var(--ink-soft); font-family: 'Literata', Georgia, serif; }
.jeu-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.jeu-actions button {
  font-family: inherit; cursor: pointer; border-radius: 999px; font-size: 15px;
  padding: 11px 20px; border: 2.5px solid var(--ink);
  background: var(--page); color: var(--ink); box-shadow: 0 3px 0 var(--ink);
}
.jeu-actions button:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.jeu-actions button.primary { background: var(--jaune); font-weight: 600; }

@media (min-width: 720px) {
  .jeux-grid { grid-template-columns: 1fr 1fr; }
  .jeu-stage { max-width: 640px; margin: 10px auto 0; }
}

/* ---------------- LE LIVRET ---------------- */
.reader {
  position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
  background-color: var(--paper);
}
.reader::after {
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 3;
  background-image: var(--grain); background-size: 96px 96px;
  opacity: .3; mix-blend-mode: multiply;
}

.reader-top {
  position: relative; z-index: 4;
  display: flex; align-items: center; gap: 10px;
  padding: calc(var(--safe-top) + 10px) 12px 10px;
  background: var(--rouge); border-bottom: 3px solid var(--ink);
}
.reader-title {
  flex: 1; text-align: center; font-size: 16px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: #fff6e4;
}
.rbtn {
  width: 38px; height: 38px; border-radius: 50%; flex: 0 0 auto;
  border: 2.5px solid var(--ink); background: #fff6e4;
  color: var(--ink); font-size: 16px; cursor: pointer; font-family: inherit;
  display: grid; place-items: center; box-shadow: 0 2px 0 var(--ink);
}
.rbtn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--ink); }
.rbtn.on { background: var(--jaune); }

.pages {
  position: relative; z-index: 2;
  flex: 1; display: flex; overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory; scrollbar-width: none;
  -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
  animation: fadeUp .28s ease both;
}
.pages::-webkit-scrollbar { display: none; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

.page {
  flex: 0 0 100%; scroll-snap-align: center; scroll-snap-stop: always;
  padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 14px;
  justify-content: center;
  overflow-y: auto; overscroll-behavior-y: contain;
}

/* l'illustration, posée sur la page comme une vignette imprimée */
.panel {
  flex: 0 0 auto; overflow: hidden;
  border: 3px solid var(--ink);
  background: var(--page);
  box-shadow: 4px 5px 0 rgba(58, 42, 34, .2);
}
.panel svg { display: block; width: 100%; height: auto; }

/* le texte de l'histoire */
.ptext {
  margin: 0; padding: 0 4px;
  color: var(--ink); font-size: 18.5px; line-height: 1.62;
  font-family: 'Literata', Georgia, 'Times New Roman', serif;
  font-weight: 400; text-wrap: pretty;
}
.ptext::first-letter {
  float: left; font-size: 3.1em; line-height: .82; padding: 4px 8px 0 0;
  color: var(--rouge); font-family: 'Fredoka', sans-serif; font-weight: 700;
}
.pnum {
  align-self: center; font-size: 12px; color: var(--ink-soft); opacity: .7;
  padding-bottom: 2px;
}

/* la dernière page */
.page-end { justify-content: center; align-items: center; text-align: center; gap: 16px; }
.end-badge { font-size: 54px; }
.page-end h4 {
  margin: 0; font-size: 30px; font-weight: 700; color: var(--rouge);
}
.page-end p {
  margin: 0; color: var(--ink-soft); font-size: 16px; max-width: 32ch;
  font-family: 'Literata', Georgia, serif;
}
.end-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.end-actions button {
  font-family: inherit; cursor: pointer; border-radius: 999px; font-size: 15px;
  padding: 10px 18px; border: 2.5px solid var(--ink);
  background: var(--page); color: var(--ink); box-shadow: 0 3px 0 var(--ink);
}
.end-actions button:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.end-actions button.primary { background: var(--jaune); font-weight: 600; }

.reader-bottom {
  position: relative; z-index: 4;
  display: flex; align-items: center; gap: 12px; justify-content: center;
  padding: 8px 14px calc(var(--safe-bot) + 12px);
  background: var(--paper-2); border-top: 3px solid var(--ink);
}
.rnav {
  width: 44px; height: 44px; border-radius: 50%; flex: 0 0 auto;
  border: 2.5px solid var(--ink); background: var(--page);
  color: var(--ink); font-size: 25px; cursor: pointer; font-family: inherit;
  display: grid; place-items: center; padding-bottom: 4px;
  box-shadow: 0 3px 0 var(--ink);
}
.rnav:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.rnav:disabled { opacity: .3; box-shadow: none; transform: none; }
.rdots { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; max-width: 58vw; }
.rdots i {
  width: 7px; height: 7px; border-radius: 50%; background: var(--paper-3);
  border: 1.5px solid var(--ink); opacity: .45; transition: .2s;
}
.rdots i.on { background: var(--rouge); opacity: 1; transform: scale(1.25); }

/* ---------------- écrans larges ---------------- */
@media (min-width: 720px) {
  .logo-txt b { font-size: 26px; }
  .logo-txt i { font-size: 17px; }
  .mainnav button { font-size: 17px; padding: 10px 28px; }
  .view { padding: 16px 24px 50px; max-width: 1100px; margin: 0 auto; }
  .uni-grid { grid-template-columns: 1fr 1fr; gap: 22px; }
  .cf-stage { height: min(52vh, 390px); margin: 12px 0 0; }
  .cf-item { width: 210px; margin: calc(210px * 4 / 3 / -2 * 1.04) 0 0 -105px; }
  .cf-meta h3 { font-size: 26px; }
  .page { padding: 18px 24px 12px; align-items: center; }

  function wrapText(t, max) {
    var words = t.split(' '), lines = [], cur = '', i;
    for (i = 0; i < words.length; i++) {
      var cand = cur ? cur + ' ' + words[i] : words[i];
      if (cand.length > max && cur) { lines.push(cur); cur = words[i]; }
      else cur = cand;

    if (cur) lines.push(cur);
    return lines;
  }

  /* combien de place prend cette bulle ? Le calcul est le même que celui du
     tracé — c'est volontaire : deux formules qui divergent, et la bulle se
     pose à côté de là où elle est dessinée. */
  function mesurerBulle(b) {
    var fs = b.fs || 25;
    var w = b.w || 250;
    var max = Math.max(6, Math.floor((w - 34) / (fs * 0.52)));
    var lignes = wrapText(b.t, max);
    return { w: w, h: lignes.length * (fs + 7) + 26, lignes: lignes.length };
  }

  function bubble(b) {
    var fs = b.fs || 25;
    var w = b.w || 250;
    var max = Math.max(6, Math.floor((w - 34) / (fs * 0.52)));
    var lines = wrapText(b.t, max);
    var lh = fs + 7;
    var h = lines.length * lh + 26;
    var x = b.x, y = b.y;
    var cx = x + w / 2;
    var tail;
    var tx = (b.tx !== undefined) ? b.tx : cx;
    var ty = (b.ty !== undefined) ? b.ty : y + h + 54;
    var pense = b.pense;
    var parts = ['<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (pense ? 26 : 20) + '" fill="%F%" %S%/>'];
    if (!pense) {
      var bx = Math.max(x + 20, Math.min(x + w - 46, tx - 14));
      parts.push('<path d="M ' + bx + ',' + (y + h - 10) + ' L ' + (bx + 32) + ',' + (y + h - 10) + ' L ' + tx + ',' + ty + ' Z" fill="%F%" %S%/>');
    } else {
      parts.push('<circle cx="' + (cx - 10) + '" cy="' + (y + h + 16) + '" r="12" fill="%F%" %S%/>');
      parts.push('<circle cx="' + (cx - 22) + '" cy="' + (y + h + 40) + '" r="7" fill="%F%" %S%/>');
    }
    var s = U(parts, b.fill || '#fdf7ea', 9);
    var ty0 = y + 18 + fs * 0.82;
    s += '<text x="' + cx + '" y="' + ty0 + '" text-anchor="middle" font-family="' + FONT + '" font-size="' + fs +
      '" font-weight="700" fill="' + INK + '">';
    for (var i = 0; i < lines.length; i++) {
      s += '<tspan x="' + cx + '" dy="' + (i === 0 ? 0 : lh) + '">' + esc(lines[i]) + '</tspan>';
    }
    s += '</text>';
    return s;
  }

      var queue = Math.abs((b.x + t.w / 2) - b.tx) + Math.abs((b.y + t.h) - b.ty);

          dit: 'la queue de « ' + b.t.slice(0, 24) + '… » fait ' + Math.round(queue) + ' unités'

      }

  var LETTRES = {

    K: ['M 30,14 L 30,86', 'M 72,14 L 34,52', 'M 42,44 L 74,86'],
    L: ['M 32,14 L 32,86', 'M 32,86 L 70,86'],
    M: ['M 24,86 L 24,14', 'M 24,14 L 50,58', 'M 50,58 L 76,14', 'M 76,14 L 76,86'],
    N: ['M 28,86 L 28,14', 'M 28,14 L 72,86', 'M 72,86 L 72,14'],
    O: ['M 50,14 C 30,14 20,32 20,50 C 20,68 30,86 50,86 C 70,86 80,68 80,50 C 80,32 70,14 50,14'],
    P: ['M 30,86 L 30,14', 'M 30,14 L 56,14 C 78,14 78,52 56,52 L 30,52'],
    Q: ['M 50,14 C 30,14 20,32 20,50 C 20,68 30,86 50,86 C 70,86 80,68 80,50 C 80,32 70,14 50,14',
      'M 58,66 L 80,90'],
    R: ['M 30,86 L 30,14', 'M 30,14 L 56,14 C 76,14 76,50 56,50 L 30,50', 'M 46,50 L 74,86'],
    S: ['M 74,26 C 66,14 40,10 32,24 C 25,37 40,46 52,50 C 66,55 80,62 74,76 C 66,91 34,88 26,74'],

    V: ['M 24,14 L 50,86', 'M 50,86 L 76,14'],
    W: ['M 18,14 L 32,86', 'M 32,86 L 50,38', 'M 50,38 L 68,86', 'M 68,86 L 82,14'],

    Z: ['M 26,14 L 74,14', 'M 74,14 L 26,86', 'M 26,86 L 74,86']
  };

  /* Les prénoms à tracer. Ceux-ci sont des prénoms d'attente : le jour où la
     famille est créée, c'est elle qui remplit cette liste — un enfant apprend
     d'abord à écrire SON prénom, pas un prénom d'exemple. */
  var PRENOMS_ATTENTE = ['MAMAN', 'PAPA', 'LÉA', 'TOM', 'JADE', 'HUGO', 'ZOÉ', 'NOÉ',
    'ALICE', 'GASPARD', 'MAMIE', 'PAPI'];

  /* Un enfant apprend d'abord à écrire SON prénom, pas un prénom d'exemple :
     dès que la famille existe, ce sont ses prénoms qu'on trace. On ne garde
     que ceux dont toutes les lettres sont traçables. */
  function prenoms() {
    var famille = (global.Perso && Perso.tous()) || [];
    var liste = famille.map(function (p) { return (p.prenom || '').toUpperCase(); })
      .filter(function (n) {
        return n.length > 1 && n.split('').every(function (c) { return LETTRES[c]; });
      });
    return liste.length ? liste : PRENOMS_ATTENTE;
  }

  var NS = 'http://www.w3.org/2000/svg';
  var lotPrenoms = null;

  /* la grille de choix : un bouton par prénom, plus le tirage au sort */
  function grilleChoix(zone, items, pret, hasard) {
    var g = el('div', 'choix-grille');
    items.forEach(function (t) {
      var b = el('button', 'choix-b', t);

    var h = el('button', 'choix-hasard', hasard || '🎲 Au hasard');
    h.onclick = function () { pret(null); };

  }
  function choixPrenom(zone, pret) { grilleChoix(zone, prenoms(), pret, '🎲 Cinq au hasard'); }

  function jeuEcrire(zone, n, api, choisi) {
    if (choisi) return ecrireMot(zone, choisi, api);
    if (n === 0 || !lotPrenoms) {
      var P = prenoms();
      lotPrenoms = piocher(P, P.length);
    }
    return ecrireMot(zone, lotPrenoms[n % lotPrenoms.length], api);
  }

  function ecrireMot(zone, nom, api, consigne) {
    var lettres = nom.split('').filter(function (c) { return LETTRES[c]; });
    api.consigne(consigne || ('Écris ' + nom + '.'));

    /* le prénom en toutes lettres, pour savoir où on en est */
    var bandeau = el('div', 'prenom');
    lettres.forEach(function (c) { bandeau.appendChild(el('span', null, c)); });
    zone.appendChild(bandeau);

    var cadre = el('div', 'trace');
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    cadre.appendChild(svg);
    zone.appendChild(cadre);

    var iLettre = 0, iTrace = 0, jalons = [], trace = [];
    var chemins = [], depart, encre;

    function chemin(d, cls, w) {
      var p = document.createElementNS(NS, 'path');
      p.setAttribute('d', d); p.setAttribute('class', cls);
      p.setAttribute('stroke-width', w); p.setAttribute('fill', 'none');
      svg.appendChild(p);
      return p;
    }

    /* les points de passage : c'est le navigateur qui mesure la courbe */
    function jalonsDe(p) {
      var L = p.getTotalLength(), res = [], pas = 6;
      var n2 = Math.max(2, Math.round(L / pas));
      for (var i = 0; i <= n2; i++) {
        var pt = p.getPointAtLength(L * i / n2);
        res.push({ x: pt.x, y: pt.y, vu: false });
      }
      return res;
    }

    function dessinerLettre() {
      svg.innerHTML = '';
      chemins = LETTRES[lettres[iLettre]].map(function (d) {
        return { d: d, guide: chemin(d, 'guide', 13) };
      });
      chemins.forEach(function (c) { chemin(c.d, 'pointille', 1.6); });
      depart = document.createElementNS(NS, 'circle');
      depart.setAttribute('class', 'depart'); depart.setAttribute('r', 5);
      svg.appendChild(depart);
      encre = document.createElementNS(NS, 'polyline');
      encre.setAttribute('class', 'encre');
      svg.appendChild(encre);
      iTrace = 0;
      majTrace();
      var sp = bandeau.children;
      for (var i = 0; i < sp.length; i++) {
        sp[i].className = i < iLettre ? 'fait' : (i === iLettre ? 'ici' : '');
      }
    }

    function majTrace() {
      if (iTrace >= chemins.length) { depart.style.display = 'none'; return; }
      jalons = jalonsDe(chemins[iTrace].guide);
      depart.style.display = '';
      depart.setAttribute('cx', jalons[0].x);
      depart.setAttribute('cy', jalons[0].y);
    }

    function coord(e) {
      var r = svg.getBoundingClientRect();
      return { x: (e.clientX - r.left) / r.width * 100, y: (e.clientY - r.top) / r.height * 100 };
    }

    var dessine = false;
    function debut(e) {
      if (iTrace >= chemins.length) return;
      dessine = true; trace = []; encre.setAttribute('points', '');
      svg.setPointerCapture && svg.setPointerCapture(e.pointerId);
      bouge(e);
    }
    function bouge(e) {
      if (!dessine) return;
      e.preventDefault();
      var p = coord(e);
      trace.push(p.x.toFixed(1) + ',' + p.y.toFixed(1));
      encre.setAttribute('points', trace.join(' '));
      var vus = 0;
      jalons.forEach(function (j) {
        if (!j.vu) {
          var dx = j.x - p.x, dy = j.y - p.y;
          if (dx * dx + dy * dy < 121) j.vu = true;   // rayon 11
        }
        if (j.vu) vus++;
      });
      if (vus / jalons.length >= .8) traceFini();
    }
    function fin() { dessine = false; }

    function traceFini() {
      dessine = false;
      chemins[iTrace].guide.classList.add('fait');
      chemin(chemins[iTrace].d, 'ecrit', 11);
      svg.appendChild(depart); svg.appendChild(encre);
      encre.setAttribute('points', '');
      iTrace++;
      if (iTrace < chemins.length) { majTrace(); dire('Encore un trait !'); return; }
      majTrace();
      iLettre++;
      if (iLettre >= lettres.length) { setTimeout(function () { api.reussi(); }, 450); return; }
      var sp = bandeau.children;
      sp[iLettre - 1].className = 'fait';
      setTimeout(function () {
        dessinerLettre();
        dire('Maintenant le ' + lettres[iLettre] + '.');
      }, 500);
    }

    svg.addEventListener('pointerdown', debut);
    svg.addEventListener('pointermove', bouge);
    svg.addEventListener('pointerup', fin);
    svg.addEventListener('pointercancel', fin);

    dessinerLettre();
  }

  /* ============================================================
     JEU 5 — L'ALPHABET
     Deux exercices en alternance : reconnaître la lettre parmi trois,
     puis la tracer. On apprend à la voir avant de savoir l'écrire.
     ============================================================ */
  var ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  var lotLettres = null;

  function choixLettre(zone, pret) {
    grilleChoix(zone, ALPHABET, pret, '🎲 Six au hasard');

  function jeuAlphabet(zone, n, api, choisie) {

      if (n === 0 || !lotLettres) lotLettres = piocher(ALPHABET, ALPHABET.length);
      lettre = lotLettres[Math.floor(n / 2) % lotLettres.length];
    }
    /* une fois sur deux on reconnaît, une fois sur deux on trace */
    if (n % 2 === 0) reconnaitreLettre(zone, lettre, api);
    else tracerLettre(zone, lettre, api);
  }

  function reconnaitreLettre(zone, lettre, api) {
    api.consigne('Touche la lettre ' + lettre + '.');

  function tracerLettre(zone, lettre, api) {

  /* ============================================================

  /* ============================================================
     JEU 4 — LES 6 DIFFÉRENCES
     On repart des planches déjà dessinées : à gauche la case d'origine,
     à droite la même case retouchée en six endroits. Les retouches sont
     fabriquées à partir de la scène elle-même — rien n'est dessiné à la
     main, et une nouvelle histoire donne aussitôt une nouvelle planche.
     ============================================================ */
  var A_TROUVER = 6;

  /* un personnage, c'est n'importe quelle silhouette : le jeu n'a plus de
     liste de héros à tenir à jour */
  var PERSOS = Object.keys(Art.silhouettes);

  /* de quoi ajouter un élément qui n'a rien à faire là, selon le décor */
  var AJOUTS = {
    plage: ['coquillage', 'etoilemer', 'crabe'], mer: ['coquillage', 'etoilemer'],
    jardin: ['fleur', 'ballon', 'buisson'], colline: ['fleur', 'buisson', 'caillou'],
    ruisseau: ['fleur', 'caillou', 'buisson'], campement: ['fleur', 'buche', 'buisson'],
    foret: ['fleur', 'buisson', 'caillou'], neige: ['bouleneige', 'sapin', 'bouleneige'],
    village: ['fleur', 'buisson', 'ballon'], route: ['fleur', 'buisson', 'caillou'],
    chambre: ['cube', 'ballon', 'valise'], uni: ['fleur', 'ballon', 'buisson']
  };

  /* ------------------------------------------------------------
     Les planches du jeu des différences sont celles des histoires : une
     histoire écrite donne aussitôt une énigme. Tant qu'il n'y en a
     aucune, on se rabat sur ces trois scènes de démonstration — le jeu
     doit tourner le premier jour, avant la première histoire.
     ------------------------------------------------------------ */
  /* Une équipe de personnages DISTINCTS, quelle que soit la taille de la
     famille. Prendre `C[i % n]` paraît suffisant, mais avec quatre
     personnages et les indices 0, 4, 3 on retrouve deux fois le même sur la
     planche — et une planche où l'enfant se voit en double, ça se remarque
     tout de suite. Si la famille est trop petite, la scène est plus petite. */
  function equipe(C, depart, poses) {
    var n = C.length, combien = Math.min(poses.length, n), out = [], i;
    for (i = 0; i < combien; i++) {
      out.push(merge(C[(depart + i) % n].qui, { pose: poses[i] }));
    }
    return out;
  }

  /* Ces trois scènes ne portent AUCUNE coordonnée : elles donnent un
     casting et un décor, et la mise en scène place. C'est ce qui leur
     permet de marcher avec la famille de n'importe qui — trois enfants de
     même taille comme un bébé, une mamie et un doudou. */
  function scenesDemo() {
    var C = casting();
    return [
      Scene.composer({
        decor: 'plage',
        casting: equipe(C, 0, ['salue', 'assis', 'brasenlair']),
        fond: [{ t: 'palmier', x: 110, y: 400, s: 1.1 },
          { t: 'parasol', x: 690, y: 420, s: .8, color: '#ff5c8a' }],
        avant: [{ t: 'coquillage', x: 120, y: 542, s: 1.6 }, { t: 'etoilemer', x: 340, y: 552, s: 1.4 },
          { t: 'seau', x: 560, y: 546, s: .9, color: '#3ec9c9' }, { t: 'crabe', x: 740, y: 540, s: 1.2 }]
      }),
      Scene.composer({
        decor: 'jardin',
        casting: equipe(C, 1, ['court', 'montre', 'saute']),
        fond: [{ t: 'arbre', x: 120, y: 400, s: 1.15 }, { t: 'buisson', x: 700, y: 420, s: 1.1 }],
        avant: [{ t: 'fleur', x: 90, y: 548, s: 1.7 }, { t: 'fleur', x: 330, y: 552, s: 1.5, color: '#fff1a8' },
          { t: 'ballon', x: 560, y: 544, s: 1.1 }, { t: 'papillon', x: 700, y: 300, s: 1.5 }]
      }),
      Scene.composer({
        decor: 'chambre', heure: 'nuit',
        casting: equipe(C, 2, ['tient', 'assis', 'debout']),
        fond: [{ t: 'etagere', x: 180, y: 400, s: .9 }],
        avant: [{ t: 'cube', x: 120, y: 548, s: 1.3 }, { t: 'tourcubes', x: 340, y: 550, s: .9, n: 3 },
          { t: 'peluche', x: 700, y: 544, s: 1.6 }]
      })
    ];
  }

  /* deux rangs : au premier plan, et un peu en retrait dans le décor */
  var PLACES = [[70, 550], [190, 548], [320, 552], [470, 550], [610, 548], [730, 546],
    [110, 468], [250, 464], [400, 460], [550, 464], [690, 466]];

  /* un tirage reproductible : une planche donnée pose toujours la même énigme */
  function graineur(g) {
    return function () { g = (g * 1103515245 + 12345) % 2147483648; return g / 2147483648; };
  }
  function melangeAvec(a, r) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(r() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* Le catalogue des planches jouables. On ne le fige pas : il est reconstruit
     à chaque partie, pour qu'une histoire ajoutée le matin soit jouable le soir.
     On ne retient qu'une planche sur deux — deux planches voisines se
     ressemblent trop pour faire deux énigmes différentes. */
  function planchesJouables() {
    var out = [];
    UNIVERSES.forEach(function (u) {
      u.stories.forEach(function (s) {
        s.pages.forEach(function (pg, i) {
          if (i % 2 === 0 && pg.scene && (pg.scene.items || []).length) {
            out.push({ scene: pg.scene, graine: out.length });
          }
        });
      });
    });
    if (!out.length) {
      out = scenesDemo().map(function (sc, i) { return { scene: sc, graine: i }; });
    }
    return out;
  }

  var HUMEURS = ['content', 'surpris', 'triste'];

  /* ------------------------------------------------------------
     Fabriquer les six différences.

     L'ordre compte : on choisit d'abord la FENÊTRE — la portion de case
     qu'on va montrer — puis on ne retouche que ce qui s'y trouve. C'est
     l'inverse de l'intuition, mais c'est ce qui garantit un dessin assez
     grand sur un téléphone : une fenêtre de 400 unités sur 800, c'est un
     dessin deux fois plus gros. Si on n'y trouve pas six différences, on
     élargit d'un cran.
     ------------------------------------------------------------ */
  function fabriquerDifferences(scene, graine, format) {
    var W = 800, H = 560;
    format = format || W / H;
    var r = graineur(graine);
    var copie = JSON.parse(JSON.stringify(scene));
    delete copie.bulles;

    var elements = [];
    ['fond', 'items', 'avant'].forEach(function (c) {
      (copie[c] || []).forEach(function (it) {
        var perso = PERSOS.indexOf(it.t) >= 0;
        elements.push({
          it: it, perso: perso,
          x: it.x, y: it.y - (perso ? 110 * (it.s || 1) : 22)
        });
      });
    });

    var pivots = elements.filter(function (e) { return e.perso; });
    var pv = pivots.length ? pivots[Math.floor(r() * pivots.length)] : { x: W / 2, y: 380 };

    function fenetre(largeur) {
      /* la fenêtre prend le format de la case à l'écran : sur un téléphone
         en plein écran, elle est plus haute que large */
      var w = Math.min(largeur, W), h = w / format;
      if (h > H) { h = H; w = Math.min(W, h * format); }
      return {
        x: Math.min(Math.max(pv.x - w / 2, 0), W - w),
        y: Math.min(Math.max(pv.y - h * 0.42, 0), H - h),
        w: w, h: h
      };
    }
    function dedans(f, x, y, m) {
      m = m || 0;
      return x > f.x + m && x < f.x + f.w - m && y > f.y + m && y < f.y + f.h - m;
    }

    /* le plan : ce qu'on va changer, sans encore rien changer */
    function planifier(f) {
      var ecartMin = f.w * 0.16;
      var zones = [], plan = [];
      function loin(x, y, d) {
        return zones.every(function (z) {
          return (z.x - x) * (z.x - x) + (z.y - y) * (z.y - y) > d * d;
        });
      }

      var objets = [], persos = [];
      elements.forEach(function (e) {
        if (!dedans(f, e.x, e.y, 10)) return;
        (e.perso ? persos : objets).push(e);
      });

          : '<b>Terminé</b> pour ce soir') +
        '</span>' +
        '<button class="soir-pm" data-ajuste="1" aria-label="une histoire de plus">+</button>' +
        '</span><button class="soir-changer" data-soir="0">remettre à zéro</button>';
    }
    els.soirCover.onclick = function (e) {
      var b = e.target;
      if (!b.getAttribute) return;
      var d = b.getAttribute('data-ajuste');
      if (d !== null) { Soir.ajuster(parseInt(d, 10)); majSoir(); return; }
      var n = b.getAttribute('data-soir');
      if (n === null) return;
      Soir.definir(parseInt(n, 10));
      majSoir();
    };
  }

  els.soirBadge.onclick = function () { location.hash = '#/'; };

  /* ---------------- le menu principal ---------------- */
  function cablerNav(zone, actif) {
    var b = zone.children;
    for (var i = 0; i < b.length; i++) {
      var nav = b[i].getAttribute('data-nav');
      b[i].className = nav === actif ? 'is-active' : '';
      b[i].onclick = (function (n) {
        return function () { location.hash = '#/' + (n === 'histoires' ? 'histoires' : n); };
      })(nav);
    }
  }
  function renderNav(actif) { cablerNav(els.mainnav, actif); }
  cablerNav(els.coverNav, null);

  /* ---------------- onglets ----------------
     Hors d'un thème, ils ouvrent l'univers. Dans un thème, ils le filtrent :
     c'est le même rang de boutons qui sert aux deux axes. */
  function renderTabs(activeId, theme, dispo) {
    els.tabs.innerHTML = '';
    var lien = function (uid) {
      if (!theme) return uid ? '#/u/' + uid : '#/histoires';
      return '#/theme/' + theme.id + (uid ? '/' + uid : '');
    };
    var all = document.createElement('button');
    all.className = 'tab' + (activeId ? '' : ' is-active');
    all.textContent = '★ Tous';
    all.onclick = function () { location.hash = lien(null); };
    els.tabs.appendChild(all);

    UNIVERSES.forEach(function (u) {
      if (dispo && dispo.indexOf(u.id) < 0) return;
      var b = document.createElement('button');
      b.className = 'tab' + (activeId === u.id ? ' is-active' : '');
      b.textContent = u.emoji + ' ' + u.name;
      b.onclick = function () { location.hash = lien(u.id); };
      els.tabs.appendChild(b);
    });
  }

  /* ---------------- les thèmes ---------------- */
  function themeParId(id) {
    for (var i = 0; i < THEMES.length; i++) if (THEMES[i].id === id) return THEMES[i];
    return null;
  }
  function histoiresDuTheme(theme, uid) {
    var out = [];
    UNIVERSES.forEach(function (u) {
      if (uid && u.id !== uid) return;
      u.stories.forEach(function (s) {
        if (s.themes && s.themes.indexOf(theme.nom) >= 0) out.push({ u: u, s: s });
      });
    });
    return out;
  }
  function renderChips(actif) {
    els.themeChips.innerHTML = '';
    THEMES.forEach(function (t) {
      var n = histoiresDuTheme(t).length;
      if (!n) return;
      var b = document.createElement('button');
      b.className = 'chip' + (actif === t.id ? ' is-active' : '');
      b.innerHTML = t.emoji + ' ' + t.nom + ' <i>' + n + '</i>';
      b.onclick = function () {
        location.hash = actif === t.id ? '#/histoires' : '#/theme/' + t.id;
      };
      els.themeChips.appendChild(b);
    });
  }

  function carteHistoire(u, s) {
    var card = document.createElement('button');
    card.className = 'uni-card';
    card.innerHTML =
      '<div class="band"><h3>' + u.emoji + ' ' + s.title + '</h3>' +
      '<span class="num">' + numero(u, s) + '</span></div>' +
      '<div class="thumb">' + Art.scene(s.cover, { rogne: true, sansBulles: true }) + '</div>' +
      '<div class="cap"><p>' + s.subtitle + '</p>' +
      '<span class="pill">' + s.pages.length + ' planches</span></div>';
    card.onclick = function () { location.hash = '#/u/' + u.id + '/' + s.id; };
    return card;
  }

  function renderTheme(theme, uid) {
    var tout = histoiresDuTheme(theme);
    var dispo = [];
    tout.forEach(function (h) { if (dispo.indexOf(h.u.id) < 0) dispo.push(h.u.id); });
    renderTabs(uid, theme, dispo);
    renderChips(theme.id);
    var liste = uid ? tout.filter(function (h) { return h.u.id === uid; }) : tout;
    els.hello.innerHTML = theme.emoji + ' <b>' + theme.nom + '</b> — ' + liste.length +
      ' histoire' + (liste.length > 1 ? 's' : '') +
      ' <button class="lien-effacer" id="btnEffacer">tout afficher</button>';
    els.grid.innerHTML = '';
    liste.forEach(function (h) { els.grid.appendChild(carteHistoire(h.u, h.s)); });
    var e = $('#btnEffacer');
    if (e) e.onclick = function () { location.hash = '#/histoires'; };
  }

  /* ---------------- les jeux ---------------- */
  /* le rang de jeux : on passe de l'un à l'autre sans revenir en arrière */
  function renderJeuxNav(actif) {
    els.jeuxNav.hidden = !actif;
    if (!actif) return;
    els.jeuxNav.innerHTML = '';
    var tous = document.createElement('button');
    tous.className = 'chip';
    tous.textContent = '↩ Tous les jeux';
    tous.onclick = function () { location.hash = '#/jeux'; };
    els.jeuxNav.appendChild(tous);
    Jeux.liste.forEach(function (j) {
      var b = document.createElement('button');
      b.className = 'chip' + (j.id === actif ? ' is-active' : '');
      b.textContent = j.emoji + ' ' + j.nom;
      b.onclick = function () { location.hash = '#/jeux/' + j.id; };
      els.jeuxNav.appendChild(b);
    });
  }

  /* les jeux prennent leurs héros dans la famille : si elle a changé, les
     vignettes du catalogue doivent changer avec elle */
  function renderGames() {
    if (Jeux.rafraichir) Jeux.rafraichir();
    els.gamesGrid.innerHTML = '';
    els.gamesGrid.hidden = false;
    els.gameStage.hidden = true;
    els.gameStage.innerHTML = '';
    els.gamesSub.textContent = 'Pour jouer tout seul, dès 3 ans';
    renderJeuxNav(null);

    Jeux.liste.forEach(function (jeu) {
      var c = document.createElement('button');
      c.className = 'jeu-carte';
      c.innerHTML =
        '<div class="jeu-vignette">' + Art.vignette(jeu.vignette) + '</div>' +
        '<div class="jeu-texte"><h3>' + jeu.emoji + ' ' + jeu.nom + '</h3>' +
        '<p>' + jeu.sous + '</p></div>';
      c.onclick = function () { location.hash = '#/jeux/' + jeu.id; };
      els.gamesGrid.appendChild(c);
    });
  }

  function openGame(jeu) {
    els.gamesGrid.hidden = true;
    els.gameStage.hidden = false;
    els.gamesSub.textContent = jeu.sous;
    renderJeuxNav(jeu.id);
    Jeux.lancer(els.gameStage, jeu, function () { location.hash = '#/jeux'; });
  }

  /* ---------------- la une ---------------- */
  var MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin',
    'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];

  var coverForme = null;

  /* l'illustration est recomposée si la forme de l'écran change */
  function dessinerUne() {
    var r = els.coverArt.getBoundingClientRect();
    var forme = (r.width / Math.max(1, r.height)) < 1.15 ? 'haut' : 'large';
    if (forme === coverForme) return;
    coverForme = forme;
    var pastille = els.coverSticker;
    els.coverArt.innerHTML = Art.scene(COUVERTURE[forme], { rogne: true, sansBulles: true });
    els.coverArt.appendChild(pastille);        // la pastille reste par-dessus
  }

  function renderCover() {
    dessinerUne();
    renderSoirCover();
    if (els.coverMeta.textContent) return;        // le reste ne change jamais

    var d = new Date();
    els.coverMeta.textContent = MOIS[d.getMonth()] + ' ' + d.getFullYear();

    var total = 0;
    UNIVERSES.forEach(function (u) { total += u.stories.length; });
    els.coverSticker.hidden = !total;
    els.coverSticker.innerHTML = '<b>' + total + '</b><span>histoire' +
      (total > 1 ? 's' : '') + '<br>du soir</span>';
    /* pas d'histoire, pas de dé : un bouton qui ne mène nulle part est pire
       qu'un bouton absent */
    els.coverRandom.hidden = !total;
    els.random.hidden = !total;
    if (els.soirCover) els.soirCover.hidden = !total;
  }

  /* ---------------- sommaire ---------------- */
  function renderHome() {
    renderChips(null);
    els.grid.innerHTML = '';
    if (!UNIVERSES.length) {
      /* Le premier soir, il n'y a rien à lire — et c'est normal. Autant le
         dire, plutôt que de montrer une page blanche. */
      els.hello.textContent = 'Aucune histoire pour l\'instant.';
      var vide = document.createElement('p');
      vide.className = 'vide';
      vide.innerHTML = 'Les histoires arrivent bientôt.<br>' +
        'En attendant, les <b>jeux</b> fonctionnent déjà.';
      els.grid.appendChild(vide);
      return;
    }
    els.hello.textContent = 'Choisis un univers, ou un thème.';
    UNIVERSES.forEach(function (u) {
      var card = document.createElement('button');
      card.className = 'uni-card';
      var n = u.stories.length;
      card.innerHTML =
        '<div class="band"><h3>' + u.emoji + ' ' + u.name + '</h3>' +
        '<span class="num">' + plageNumeros(u) + '</span></div>' +
        '<div class="thumb">' + Art.scene(u.cover, { rogne: true, sansBulles: true }) + '</div>' +
        '<div class="cap"><p>' + u.tagline + '</p>' +
        '<span class="pill">' + n + ' histoire' + (n > 1 ? 's' : '') + '</span></div>';
      card.onclick = function () { location.hash = '#/u/' + u.id; };
      els.grid.appendChild(card);
    });
  }

  /* ---------------- univers ---------------- */
  function renderUniverse(u, startId) {
    state.universe = u;
    setTheme(u);
    els.uniTitle.textContent = u.emoji + ' ' + u.name;
    els.uniTagline.textContent = u.tagline;

    var start = 0;
    var items = u.stories.map(function (s, i) {
      if (startId && s.id === startId) start = i;
      return {
        scene: s.cover, label: s.title, num: numero(u, s), tag: s.tag,
        badge: isRead(u, s) ? '✓' : String(s.pages.length) + ' p.'
      };
    });

    els.cfDots.innerHTML = '';
    items.forEach(function () { els.cfDots.appendChild(document.createElement('i')); });

    flow.setItems(items, start);
    requestAnimationFrame(function () { flow.layout(); });
  }

  function renderMeta(i) {
    var u = state.universe;
    if (!u || i < 0) return;
    var s = u.stories[i];
    els.cfTitle.textContent = s.title;
    els.cfSub.textContent = s.subtitle;
    els.cfTags.innerHTML =
      '<span>' + numero(u, s) + '</span><span>' + s.pages.length + ' pages</span>' +
      '<span>≈ ' + s.minutes + ' min</span>' + (isRead(u, s) ? '<span>✓ déjà lue</span>' : '');
    var dots = els.cfDots.children;
    for (var k = 0; k < dots.length; k++) dots[k].className = k === i ? 'on' : '';
    els.read.onclick = function () { location.hash = '#/u/' + u.id + '/' + s.id; };
  }

  /* ============================================================
     LECTEUR DE BD
     ============================================================ */
  function openReader(u, s) {
    state.universe = u; state.story = s;
    setTheme(u);
    els.rTitle.textContent = s.title;
    els.pages.innerHTML = '';
    /* on repart du début : sans cette remise à zéro, ouvrir une histoire
       depuis la fin de la précédente la montre déjà terminée */
    els.pages.scrollLeft = 0;

    s.pages.forEach(function (p, i) {
      var a = document.createElement('article');
      a.className = 'page';
      a.innerHTML =
        '<div class="panel">' + Art.scene(p.scene) + '</div>' +
        '<p class="ptext">' + p.text + '</p>' +
        '<div class="pnum">' + (i + 1) + ' / ' + s.pages.length + '</div>';
      els.pages.appendChild(a);
    });

    // page finale
    var end = document.createElement('article');
    end.className = 'page page-end';
    end.innerHTML = '<div class="end-badge">🌟</div><div class="end-corps"></div>';
    els.pages.appendChild(end);
    state.end = end;
    majFin(null);

    /* Le décompte du soir se déclenche quand la page « Fin ! » est vraiment à
       l'écran. On l'observe plutôt que d'écouter le défilement : un doigt
       rapide peut sauter une page, un observateur, non. Compter deux fois la
       même histoire est sans effet (voir Soir.compter). */
    if (state.obs) { state.obs.disconnect(); state.obs = null; }
    if (window.IntersectionObserver) {
      state.obs = new IntersectionObserver(function (vues) {
        for (var v = 0; v < vues.length; v++) {
          if (vues[v].isIntersecting) { majFin(Soir.compter(u, s)); majSoir(); }
        }
      }, { root: els.pages, threshold: 0.6 });
      state.obs.observe(end);
    }

    end.addEventListener('click', function (e) {
      var act = e.target.getAttribute && e.target.getAttribute('data-act');
      if (act === 'again') goPage(0);
      else if (act === 'close') location.hash = '#/u/' + u.id;
      else if (act === 'next') {
        var i = u.stories.indexOf(s);
        var nx = u.stories[(i + 1) % u.stories.length];
        location.hash = '#/u/' + u.id + '/' + nx.id;
      }
    });

    els.rDots.innerHTML = '';
    for (var k = 0; k <= s.pages.length; k++) els.rDots.appendChild(document.createElement('i'));

    els.reader.hidden = false;
    document.body.style.overflow = 'hidden';

    var saved = parseInt(store('page.' + u.id + '.' + s.id) || '0', 10);
    if (!(saved > 0 && saved < s.pages.length)) saved = 0;
    requestAnimationFrame(function () { goPage(saved, true); syncPage(); });
  }

  /* Les boutons que l'enfant utilise sont d'abord des images : à quatre ans
     on ne lit pas encore, mais on reconnaît une flèche et une maison. Le mot
     reste dessous, en petit, pour l'adulte. */
  function bouton(act, image, mot, fort) {
    return '<button class="bi' + (fort ? ' primary' : '') + '" data-act="' + act +
      '" aria-label="' + mot + '"><span class="bi-img">' + image +
      '</span><span class="bi-mot">' + mot + '</span></button>';
  }

  /* la page finale : elle change de discours selon ce qu'il reste à lire */
  function majFin(reste) {
    if (!state.end) return;
    var corps = state.end.querySelector('.end-corps');
    if (!corps) return;
    if (reste === null || reste === undefined) reste = Soir.reste();
    var titre, mot, suite = true;
    if (reste === null) {
      titre = 'Fin !';
      mot = 'Bonne nuit… et à demain pour une nouvelle histoire.';
    } else if (reste > 0) {
      titre = 'Fin !';
      mot = 'Encore <b>' + reste + '</b> histoire' + (reste > 1 ? 's' : '') + ' ce soir.';
    } else {
      titre = 'C\'était la dernière';
      mot = 'On éteint. Bonne nuit.';
      suite = false;
    }
    corps.innerHTML = '<h4>' + titre + '</h4><p>' + mot + '</p>' +
      '<div class="end-actions">' +
      (suite ? bouton('next', '▶', 'Une autre', true) : '') +
      bouton('again', '↻', 'Relire', !suite) +
      bouton('close', '⌂', 'Le sommaire', false) + '</div>';
  }

  function closeReader() {
    if (els.reader.hidden) return;
    els.reader.hidden = true;
    els.pages.innerHTML = '';
    state.story = null; state.end = null;
    if (state.obs) { state.obs.disconnect(); state.obs = null; }
    document.body.style.overflow = '';
    stopSpeak();
  }

  function goPage(i, instant) {
    var w = els.pages.clientWidth;
    els.pages.scrollTo({ left: i * w, behavior: instant ? 'auto' : 'smooth' });
  }

  function syncPage() {
    var s = state.story;
    if (!s) return;
    var w = els.pages.clientWidth || 1;
    var i = Math.round(els.pages.scrollLeft / w);
    var total = s.pages.length;
    if (i === state.page) return;
    state.page = i;

    var dots = els.rDots.children;
    for (var k = 0; k < dots.length; k++) dots[k].className = k === i ? 'on' : '';
    els.rPrev.disabled = i <= 0;
    els.rNext.disabled = i >= total;

    if (i < total) store('page.' + state.universe.id + '.' + s.id, String(i));
    if (i >= total - 1) store('read.' + state.universe.id + '.' + s.id, '1');
    /* l'histoire est finie quand la dernière page — celle du « Fin ! » — s'affiche */
    if (i >= total) { majFin(Soir.compter(state.universe, s)); majSoir(); }

    stopSpeak();
    if (state.speak && i < total) speak(s.pages[i].text);
  }

  els.pages.addEventListener('scroll', function () {
    clearTimeout(els.pages._t);
    els.pages._t = setTimeout(syncPage, 90);
  });
  els.rPrev.onclick = function () { goPage(Math.max(0, state.page - 1)); };
  els.rNext.onclick = function () { goPage(state.page + 1); };
  els.rClose.onclick = function () { location.hash = '#/u/' + state.universe.id; };

  /* ---------------- lecture à voix haute ---------------- */
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    var u = new SpeechSynthesisUtterance(text.replace(/…/g, '...'));
    u.lang = 'fr-FR'; u.rate = .92; u.pitch = 1.06;
    window.speechSynthesis.speak(u);
  }
  function stopSpeak() {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  }
  els.rSpeak.onclick = function () {
    if (!('speechSynthesis' in window)) { els.rSpeak.disabled = true; return; }
    state.speak = !state.speak;
    els.rSpeak.classList.toggle('on', state.speak);
    stopSpeak();
    if (state.speak && state.story && state.page < state.story.pages.length) {
      speak(state.story.pages[state.page].text);
    }
  };

  document.addEventListener('keydown', function (e) {
    if (els.reader.hidden) return;
    if (e.key === 'ArrowRight') els.rNext.click();
    else if (e.key === 'ArrowLeft') els.rPrev.click();
    else if (e.key === 'Escape') els.rClose.click();
  });

  /* ============================================================
     ROUTEUR
     ============================================================ */
  function route() {
    var h = location.hash.replace(/^#\/?/, '');
    var parts = h.split('/').filter(Boolean);

    if (!parts.length) {                       // la une
      closeReader();
      setTheme(null);
      els.cover.hidden = false; els.home.hidden = true; els.uni.hidden = true;
      els.games.hidden = true; els.famille.hidden = true; Jeux.taire();
      els.topbar.hidden = true; els.tabs.hidden = true; els.mainnav.hidden = true;
      renderCover();
      window.scrollTo(0, 0);
      return;
    }

    els.cover.hidden = true;
    els.topbar.hidden = false; els.mainnav.hidden = false;

    if (parts[0] === 'famille') {                // le créateur de personnages
      closeReader();
      Jeux.taire();
      renderNav('famille');
      setTheme(null);
      els.tabs.hidden = true;
      els.home.hidden = true; els.uni.hidden = true; els.games.hidden = true;
      els.famille.hidden = false;
      Perso.ouvrir(els.familleStage);
      window.scrollTo(0, 0);
      return;
    }
    els.famille.hidden = true;

    if (parts[0] === 'jeux') {                   // les jeux
      closeReader();
      Jeux.taire();
      renderNav('jeux');
      setTheme(null);
      els.tabs.hidden = true;
      els.home.hidden = true; els.uni.hidden = true; els.games.hidden = false;
      var jeu = parts[1] && Jeux.trouver(parts[1]);
      if (jeu) { renderGames(); openGame(jeu); }
      else renderGames();
      window.scrollTo(0, 0);
      return;
    }
    els.games.hidden = true;
    Jeux.taire();
    renderNav('histoires');
    els.tabs.hidden = false;

    if (parts[0] === 'theme') {                  // les histoires d'un thème
      var th = themeParId(parts[1]);
      if (!th) { location.hash = '#/histoires'; return; }
      closeReader();
      setTheme(null);
      els.home.hidden = false; els.uni.hidden = true;
      renderTheme(th, parts[2]);
      window.scrollTo(0, 0);
      return;
    }

    if (parts[0] !== 'u') {                      // la liste des univers
      closeReader();
      renderTabs(null);
      setTheme(null);
      els.home.hidden = false; els.uni.hidden = true;
      renderHome();
      window.scrollTo(0, 0);
      return;
    }

    var u = findUniverse(parts[1]);
    if (!u) { location.hash = '#/histoires'; return; }

    renderTabs(u.id);
    els.home.hidden = true; els.uni.hidden = false;

    var storyId = parts[2];
    if (state.universe !== u) renderUniverse(u, storyId);
    else if (storyId) {
      var idx = u.stories.indexOf(findStory(u, storyId));
      if (idx >= 0 && flow.current() !== idx) flow.go(idx);
    } else {
      // retour depuis le lecteur : on rafraîchit les pastilles « déjà lue »
      u.stories.forEach(function (s, i) {
        flow.setBadge(i, isRead(u, s) ? '✓' : s.pages.length + ' p.');
      });
      renderMeta(flow.current());
    }

    if (storyId) {
      var s = findStory(u, storyId);
      if (!s) { location.hash = '#/u/' + u.id; return; }
      state.page = -1;
      openReader(u, s);
    } else {
      closeReader();
      window.scrollTo(0, 0);
    }
  }

  els.coverRandom.onclick = function () { els.random.onclick(); };

  els.random.onclick = function () {
    var pool = [];
    UNIVERSES.forEach(function (u) {
      u.stories.forEach(function (s) { pool.push([u.id, s.id]); });
    });
    if (!pool.length) { location.hash = '#/histoires'; return; }
    var p = pool[Math.floor(Math.random() * pool.length)];
    location.hash = '#/u/' + p[0] + '/' + p[1];
  };

  var minuteurUne;
  window.addEventListener('resize', function () {
    if (els.cover.hidden) { coverForme = null; return; }
    clearTimeout(minuteurUne);
    minuteurUne = setTimeout(dessinerUne, 150);
  });

  /* Pas d'histoire, pas de dé. Le réglage se faisait dans la une, donc le
     bouton restait visible partout ailleurs. */
  (function () {
    var total = 0;
    UNIVERSES.forEach(function (u) { total += u.stories.length; });
    els.random.hidden = !total;
  })();

  window.addEventListener('hashchange', route);
  majSoir();
  route();
})();

</script>
