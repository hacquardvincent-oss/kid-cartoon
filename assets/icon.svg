<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Kid Cartoon : une case de BD la nuit. Aucun personnage : l'application
       n'en impose aucun, c'est l'enfant qui invente les siens. -->
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#25304f"/>
      <stop offset="100%" stop-color="#4a5a7a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#ciel)"/>
  <!-- les étoiles -->
  <circle cx="108" cy="112" r="9" fill="#fff7d6"/>
  <circle cx="176" cy="66" r="6" fill="#fff7d6"/>
  <circle cx="404" cy="330" r="7" fill="#fff7d6"/>
  <circle cx="86" cy="222" r="5" fill="#ffd166"/>
  <!-- la lune -->
  <path d="M 392,72 A 78,78 0 1 0 392,208 A 62,62 0 1 1 392,72 Z" fill="#fff7d6"/>
  <!-- la bulle de dialogue, en papier crème et trait d'encre -->
  <g stroke="#3a2a22" stroke-width="18" stroke-linejoin="round">
    <path d="M 116,206 h 216 a 40,40 0 0 1 40,40 v 116 a 40,40 0 0 1 -40,40 h -104
             l -76,58 v -58 h -36 a 40,40 0 0 1 -40,-40 v -116 a 40,40 0 0 1 40,-40 z"
          fill="#fdf7ea"/>
  </g>
  <!-- trois points : on raconte -->
  <circle cx="172" cy="304" r="19" fill="#d8342b"/>
  <circle cx="238" cy="304" r="19" fill="#d8342b"/>
  <circle cx="304" cy="304" r="19" fill="#d8342b"/>
</svg>
